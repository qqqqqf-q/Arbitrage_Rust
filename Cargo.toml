[package]
name = "rust_recode"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1.83"
dashmap = "6.1.0"
futures-util = "0.3.31"
hmac = "0.12.1"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
rust_decimal = { version = "1.36.0", features = ["serde-with-str"] }
rust_decimal_macros = "1.36.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
simd-json = "0.14.3"
teloxide = { version = "0.13.0", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.24.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
urlencoding = "2.1.3"
zeroize = "1.8.1"
hex = "0.4.3"
bytes = "1.9.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
